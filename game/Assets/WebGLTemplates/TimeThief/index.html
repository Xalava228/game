<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#292d46"><title>Вор времени · Time Thief</title><link rel="icon" href="icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0e1423;overscroll-behavior:none}body{font-family:Arial,sans-serif;color:#f4ead3;user-select:none;-webkit-user-select:none}#game{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:none}body.desktop #game{width:min(100%,200vh);height:min(100%,200vw);margin:auto}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse,#273946,#0e1423);z-index:3}#loading[hidden]{display:none}#loading img{width:94px;margin-bottom:28px}h1{font-size:clamp(24px,5vw,42px);letter-spacing:.08em;margin:0}p{font-size:14px;color:#b9bfcb;margin:16px}.track{width:220px;height:5px;background:#263548;border-radius:9px;overflow:hidden;margin:18px}#progress{height:100%;width:0;background:#95e0c5;transition:width .15s}#error{max-width:440px;text-align:center;white-space:pre-line}button{border:0;border-radius:12px;color:#fffaf0;background:#292d46;padding:14px 24px;font-size:17px;cursor:pointer}footer{position:absolute;bottom:30px;font-size:11px;letter-spacing:.12em;color:#b9bfcb}
</style></head><body><main id="game"><canvas id="unity-canvas" tabindex="0" aria-label="Вор времени — игровое поле"></canvas></main><div id="loading"><img src="icon.png" alt=""><h1 id="title">ВОР ВРЕМЕНИ</h1><p id="status">Собираем потерянные секунды…</p><div class="track"><div id="progress"></div></div><div id="error"></div><footer>TIME THIEF · 2026</footer></div><script src="sdk-bridge.js"></script><script>
(async()=>{
const canvas=document.getElementById('unity-canvas');canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('dragstart',e=>e.preventDefault());
try{await window.TimeThiefSDK.init();const en=TimeThiefSDK.lang==='en';const device=TimeThiefSDK.sdk?.deviceInfo;document.body.classList.toggle('desktop',device?device.isDesktop():!matchMedia('(pointer:coarse)').matches);document.documentElement.lang=en?'en':'ru';if(en){document.title='Time Thief';document.getElementById('title').textContent='TIME THIEF';document.getElementById('status').textContent='Gathering the lost seconds…';canvas.setAttribute('aria-label','Time Thief game');}
await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onload=resolve;script.onerror=reject;document.body.append(script);});
const instance=await createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Xalava',productName:'TimeThief',productVersion:'1.4.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.5)},p=>document.getElementById('progress').style.width=Math.round(p*100)+'%');
TimeThiefSDK.attach(instance);canvas.focus();if(TimeThiefSDK.readyCalled){document.getElementById('loading').hidden=true;TimeThiefSDK.gameplay(TimeThiefSDK.wantsPlay);}
}catch(e){document.getElementById('status').textContent='Не удалось загрузить игру / Unable to load';const box=document.getElementById('error');const p=document.createElement('p');p.textContent='Проверьте соединение и поддержку WebGL 2. / Check your connection and WebGL 2 support.';box.append(p);const b=document.createElement('button');b.textContent='Повторить / Retry';b.onclick=()=>location.reload();box.append(b);console.error(e);}
})();
</script></body></html>
